<!DOCTYPE html>
<html>
<head>
    <title>Google Sign-In</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 50px auto; 
            padding: 20px;
            text-align: center;
        }
        .user-info { 
            display: none; 
            margin-top: 20px; 
            padding: 15px; 
            background: #f5f5f5; 
            border-radius: 8px;
        }
        button { 
            padding: 10px 20px; 
            margin: 10px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>🔐 Вхід через Google</h2>
    <p>Натисніть кнопку нижче для реєстрації</p>
    
    <!-- Кнопка Google Sign-In -->
    <div id="g_id_onload"
         data-client_id="453688014742-m0h3ohg69h1nr7jbhkktvmpap8oeg3u0.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleGoogleSignIn"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>

    <!-- Інформація про користувача -->
    <div id="user-info" class="user-info">
        <h3>✅ Вітаємо! Ви увійшли</h3>
        <img id="user-picture" src="" width="80" style="border-radius: 50%;">
        <p><strong>Ім'я:</strong> <span id="user-name"></span></p>
        <p><strong>Email:</strong> <span id="user-email"></span></p>
        <button onclick="signOut()">🚪 Вийти</button>
    </div>

    <script>
        function handleGoogleSignIn(response) {
            // Розшифровуємо дані користувача
            const user = parseJwt(response.credential);
            
            // Показуємо інформацію
            document.getElementById('user-name').textContent = user.name;
            document.getElementById('user-email').textContent = user.email;
            document.getElementById('user-picture').src = user.picture;
            document.getElementById('user-info').style.display = 'block';
            
            console.log("Дані користувача:", user);
            
            // Тут ви можете відправити дані на ваш сервер
            // або зберегти їх в LocalStorage
            localStorage.setItem('googleUser', JSON.stringify(user));
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(atob(base64));
            } catch (e) {
                console.error("Помилка декодування токена:", e);
                return null;
            }
        }

        function signOut() {
            // Очищаємо дані
            localStorage.removeItem('googleUser');
            document.getElementById('user-info').style.display = 'none';
            
            // Спроба вийти з Google акаунта
            google.accounts.id.disableAutoSelect();
            alert("Ви вийшли з системи");
        }

        // Перевіряємо, чи користувач вже входив
        window.onload = function() {
            const savedUser = localStorage.getItem('googleUser');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                document.getElementById('user-name').textContent = user.name;
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-picture').src = user.picture;
                document.getElementById('user-info').style.display = 'block';
            }
        }
    </script>
</body>
</html>
