<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceGen - Відновлення</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        
        h1 {
            color: #00d4ff;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00d4ff;
        }
        
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #cccccc;
        }
        
        .status {
            background: rgba(0, 212, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #00d4ff;
        }
        
        .button {
            background: #00d4ff;
            color: #0f0f23;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px #00d4ff;
        }
        
        .button:hover {
            background: #ff44aa;
            box-shadow: 0 0 20px #ff44aa;
            transform: translateY(-2px);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #00d4ff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 SpaceGen</h1>
        <p>Технічні роботи з відновлення</p>
        
        <div class="status">
            <div class="loading"></div>
            <span>Перевіряємо стан системи...</span>
        </div>
        
        <p>Наш космічний сайт тимчасово на технічному обслуговуванні. Працюємо над відновленням повної функціональності!</p>
        
        <button class="button" onclick="checkStatus()">Перевірити статус</button>
        <button class="button" onclick="restoreSite()">Відновити сайт</button>
    </div>

    <script>
        function checkStatus() {
            alert('🔧 Статус: Триває відновлення коду\n🕐 Очікуваний час: 5-10 хвилин');
        }
        
        function restoreSite() {
            alert('🚀 Запуск процесу відновлення...');
            // Тут буде код для відновлення
        }
        
        // Автоматична перевірка через 3 секунди
        setTimeout(() => {
            document.querySelector('.status span').textContent = 'Система стабільна - готуємо оновлення';
        }, 3000);
    </script>
</body>
</html>
